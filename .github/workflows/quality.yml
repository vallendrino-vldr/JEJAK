name: Quality Gate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.16.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format
        run: pnpm format:check

      - name: Secret scan
        run: pnpm secret:scan

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      # Hanya gate deterministik yang jalan di sini. Test yang menembak database
      # sungguhan ada di tests/integration dan supabase/tests; keduanya butuh
      # kredensial produksi, dan repositori ini publik — menjalankannya pada
      # setiap pull request dari siapa pun bukan pertukaran yang sehat.
      # Jalankan `pnpm gate:integrasi` sebelum deploy.
      - name: Unit tests
        run: pnpm test

      - name: Production build
        run: pnpm build

      - name: Production dependency audit
        run: pnpm security:audit
